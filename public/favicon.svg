<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="g-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="g-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container arredondado com borda sutil de neon -->
  <rect width="512" height="512" rx="128" fill="url(#g-bg)" />
  <rect x="4" y="4" width="504" height="504" rx="124" fill="none" stroke="url(#g-play)" stroke-width="6" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="180" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>

  
        <circle cx="256" cy="240" r="120" stroke="url(#g-play)" stroke-width="28" fill="none" filter="url(#glow)"/>
        <polygon points="230,195 305,240 230,285" fill="#ffffff"/>
        <rect x="300" y="290" width="30" height="70" rx="15" transform="rotate(-45 300 290)" fill="url(#g-play)"/>
        
</svg>